{% include 'layout.html' %}

<div class="container">
    <div class="card">
        <div class="card-header">Make a new Todo</div>
        <div class="card-body">
            <form id="todoForm">
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" name="title" class="form-control" required />
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea class="form-control" rows="3" name="description" required></textarea>
                </div>
                <div class="form-group">
                    <label for="">Priority</label>
                    <select name="priority" id="" class="form-control">
                        <option>1</option>
                        <option>2</option>
                        <option>3</option>
                        <option>4</option>
                        <option>5</option>
                    </select>
                </div>
                <button class="btn btn-primary" type="submit">Add new Todo</button>
                <a href="/todos/todo-page" class="btn btn-success">Back</a>
            </form>
        </div>
    </div>
</div>
